name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_tags:
        description: Cucumber tag expression for UI scenarios
        required: false
        default: '@ui'
        type: string
      app_base_url:
        description: UI application base URL
        required: false
        default: https://www.saucedemo.com
        type: string
      browser:
        description: Browser installed on the runner
        required: false
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ github.event.inputs.app_base_url || vars.APP_BASE_URL || 'https://www.saucedemo.com' }}
      APP_USERNAME: ${{ secrets.APP_USERNAME || 'standard_user' }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD || 'secret_sauce' }}
      BROWSER: ${{ github.event.inputs.browser || vars.BROWSER || 'chrome' }}
      HEADLESS: 'true'
      WAIT_TIMEOUT_SECONDS: '10'
      UI_TAGS: ${{ github.event.inputs.ui_tags || vars.UI_TAGS || '@ui' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        if: env.BROWSER == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Run UI tests
        run: >-
          mvn --batch-mode --no-transfer-progress clean test -Pui
          "-Dcucumber.filter.tags=${UI_TAGS}"
          "-Dapp.baseUrl=${APP_BASE_URL}"
          "-Dapp.username=${APP_USERNAME}"
          "-Dapp.password=${APP_PASSWORD}"
          "-Dbrowser=${BROWSER}"
          "-Dheadless=${HEADLESS}"
          "-Dwait.timeout.seconds=${WAIT_TIMEOUT_SECONDS}"

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          if-no-files-found: warn
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/allure-results/
